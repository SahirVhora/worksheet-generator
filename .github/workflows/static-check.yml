name: Static Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f index.html
          test -f quiz.html
          test -f README.md
          test -f quality-loop.js

      - name: Test worksheet quality loop
        run: node --test tests/quality-loop.test.js
